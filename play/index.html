<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Diggy's Card World</title>
  <meta name="viewport" content="width=device-width,user-scalable=no,initial-scale=1,minimum-scale=1,maximum-scale=1,minimal-ui=true"/>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="format-detection" content="telephone=no">
  <meta name="renderer" content="webkit"/>
  <meta name="force-rendering" content="webkit"/>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1"/>
  <meta name="msapplication-tap-highlight" content="no">
  <meta name="full-screen" content="yes"/>
  <meta name="x5-fullscreen" content="true"/>
  <meta name="360-fullscreen" content="true"/>
  <meta name="x5-page-mode" content="app">
  <link rel="stylesheet" type="text/css" href="style-mobile.06358.css"/>
  <style>
    /* inline belt-and-suspenders if CSS link fails on subpath */
    html, body { width:100%; height:100%; margin:0; padding:0; overflow:hidden; background:#000; }
    #GameDiv, #GameCanvas, #Cocos2dGameContainer, #Cocos3dGameContainer {
      position:fixed !important; left:0; top:0; width:100vw !important; height:100vh !important; margin:0; padding:0; overflow:hidden;
    }
  </style>
  <style id="diggy-fullscreen-patch">
    html,body{width:100%;height:100%;margin:0;padding:0;overflow:hidden;background:#000;}
    #GameDiv,#GameCanvas,#Cocos2dGameContainer,#Cocos3dGameContainer{
      position:fixed!important;left:0;top:0;width:100vw!important;height:100vh!important;margin:0;padding:0;overflow:hidden;
    }
  </style>
</head>
<body>
  <div id="GameDiv" cc_exact_fit_screen="true">
    <div id="Cocos2dGameContainer">
      <canvas id="GameCanvas" oncontextmenu="event.preventDefault()" tabindex="0"></canvas>
    </div>
  </div>
  <div id="splash">
    <div class="progress-bar stripes">
      <span style="width: 0%"></span>
    </div>
  </div>
  <!--
    Cocos 2.4.13 build injects settings.js / cocos2d-js*.js / main.d0866.js here.
    If md5Cache=true, DO NOT let this static file wipe the hashed script tags:
    keep the build-generated index.4850f.html and rely on style-mobile.06358.css +
    tools/patch-web-mobile-fullscreen.sh instead.
    Relative paths only (./) so GitHub Pages /DiggysCardWorldSite/play/ works.
  -->
  <script src="src/settings.0c004.js" charset="utf-8"></script>
  <script src="main.d0866.js" charset="utf-8"></script>
</body>
</html>
